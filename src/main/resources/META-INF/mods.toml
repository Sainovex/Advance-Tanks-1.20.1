# This is a mods.toml file configured for Java Forge and Superb Warfare addons.
# The overall format is standard TOML format, v0.5.0.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

# The license for your mod.
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional

# The description text for the mod
description='''${mod_description}'''

# Forge Dependency
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft Dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Superb Warfare Dependency
[[dependencies.${mod_id}]]
    modId="superbwarfare"
    mandatory=true
    versionRange="[0.8.9.1,)"
    ordering="AFTER"
    side="BOTH"

# Embeddium is an optional client-side optimization mod
[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=false
    versionRange="[0.3.31,)"
    ordering="AFTER"
    side="CLIENT"